name: Windows

on:
  push:
    branches:
      - main
      - "task/**"
      - "lane/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Feasibility probe for the optional native helper (lane L5): is the in-box C#
      # compiler present, and does the runner session have an interactive desktop?
      # It only reports; it never fails the build.
      - name: Probe in-box csc.exe and desktop session
        shell: pwsh
        continue-on-error: true
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Write-Host "csc.exe path: $csc"
          Write-Host "csc.exe found: $(Test-Path $csc)"
          if (-not (Test-Path $csc)) { Write-Host "PROBE RESULT: csc missing"; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP "csc-probe"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $source = Join-Path $dir "probe.cs"
          $exe = Join-Path $dir "probe.exe"
          @'
          using System;
          using System.Runtime.InteropServices;

          class Probe
          {
              [DllImport("user32.dll")] static extern IntPtr GetDesktopWindow();
              [DllImport("user32.dll")] static extern IntPtr GetForegroundWindow();

              static void Main()
              {
                  Console.WriteLine("hello from the csc probe");
                  Console.WriteLine("OSVersion=" + Environment.OSVersion);
                  Console.WriteLine("Is64BitProcess=" + Environment.Is64BitProcess);
                  Console.WriteLine("UserInteractive=" + Environment.UserInteractive);
                  Console.WriteLine("GetDesktopWindow=" + GetDesktopWindow().ToInt64());
                  Console.WriteLine("GetForegroundWindow=" + GetForegroundWindow().ToInt64());
              }
          }
          '@ | Set-Content -Path $source -Encoding ASCII
          & $csc /nologo /target:exe "/out:$exe" $source
          Write-Host "csc exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)) { Write-Host "PROBE RESULT: compile failed"; exit 0 }
          & $exe
          Write-Host "probe exit code: $LASTEXITCODE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          architecture: x64
          cache: npm

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - name: Cache compliance source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compliance-cache
          key: compliance-windows-x64-${{ hashFiles('third_party/compliance-policy.json') }}
          restore-keys: compliance-windows-x64-

      - name: Install native dependencies
        shell: pwsh
        run: |
          if ((node -p "process.arch") -ne "x64") {
            throw "Expected Node x64"
          }
          npm ci --ignore-scripts=false --dangerously-allow-all-scripts=false --strict-allow-scripts
          node -e "require('sharp'); require('onnxruntime-node'); require('koffi')"
          if (Select-String -Path package-lock.json -Pattern 'ffmpeg-static' -Quiet) {
            throw "ffmpeg-static remains in the lockfile"
          }

      - name: Cache narration model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: extraResources/models
          key: narration-model-${{ hashFiles('scripts/narration-models.json') }}

      # Fetches Xenova/whisper-small q8 and fails the job if any SHA-256 pin differs.
      - name: Fetch narration model (SHA-256 pinned)
        run: npm run models:fetch

      - name: Generate license inventory
        run: npm run compliance:licenses

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package native installer
        run: npm run dist:win:x64

      - name: Verify packaged architecture
        run: node scripts/verify-windows-package.mjs x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handover-windows-x64
          path: release/*.exe
          retention-days: 14
          if-no-files-found: error
